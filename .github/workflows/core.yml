name: ⚙️ core
# Self-contained worker. Payload is sealed; nothing in this repo is readable
# without FILE_KEY (Actions secret). Triggers: schedule / manual / external kick.
#
# 🛑 PANIC SWITCH — create a file named STOP at the repo root (web UI: Add file
#    → Create new file → name it STOP → Commit). Every running and future run
#    halts within ~60 seconds. Delete STOP to resume. Three independent layers
#    enforce it: this YAML's gate, the watchtower (watchdog.sh), the sealer.
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: run (default) | probe | poll | rfile | ids"
        type: choice
        options: [run, probe, poll, rfile, ids]
        default: run
      minutes:
        description: "run minutes (empty = 335; مثلاً 10 برای تست سریع)"
        type: string
        default: ""
        required: false
  repository_dispatch:
    types: [relay-kick]
  push:
    # 🟢 GO kick: any commit touching the file named GO starts the worker NOW
    # (web file edit is enough — no Actions UI buttons needed). paths-filtered,
    # so state-sync commits never trigger it. STOP file keeps absolute priority.
    paths: [GO]

concurrency:
  group: relay-singleton
  # a new run REPLACES the in-flight run — no queues, no jams
  cancel-in-progress: true

permissions:
  contents: write   # state-sync commits
  actions: write    # watchtower self-cancel

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # hard ceiling — no run can ever outlive this
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
      RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      FILE_KEY: ${{ secrets.FILE_KEY }}
      RUN_MINUTES: ${{ github.event.inputs.minutes || '335' }}
      LOG_LEVEL: INFO
      STATE_COMMIT_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Arm watchtower
        env:
          CANCEL_TOKEN: ${{ github.token }}
        run: |
          chmod +x watchdog.sh
          nohup bash watchdog.sh > watchtower.log 2>&1 &
          echo "watchtower armed (pid $!)"

      - name: STOP gate
        run: |
          if [ -f STOP ]; then
            echo "::warning::⛔ STOP flag present — this run is a deliberate no-op. Delete STOP to resume."
          fi

      - name: Start
        if: ${{ ! hashFiles('STOP') }}
        run: bash init.sh "${{ github.event.inputs.mode || 'run' }}" 2>&1 | tee run.log

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            run.log
            watchtower.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Final sync
        if: always()
        run: |
          git config user.name "core-bot"
          git config user.email "core-bot@users.noreply.github.com"
          [ -f state.enc ] && git add state.enc
          if git diff --cached --quiet; then
            echo "nothing to sync"
          else
            git commit -m "chore: sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            git -c rebase.autoStash=true pull --rebase origin main || true
            git push || true
          fi
